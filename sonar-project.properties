sonar.projectKey=ItsWillBill_spring-batch-enterprise
sonar.organization=ItsWillBill
sonar.projectName=Reconciliation Engine
sonar.projectVersion=1.0.0-SNAPSHOT

# --- Host ---
sonar.host.url=https://sonarcloud.io

# --- Sources ---
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.source=21
sonar.java.target=21

# --- Binaries (compiled classes — required for bytecode analysis rules) ---
sonar.java.binaries=target/classes

# --- Coverage (JaCoCo XML report produced by mvn verify) ---
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# --- Test reports ---
sonar.junit.reportPaths=target/surefire-reports

# =============================================================
# EXCLUSIONS
# =============================================================
# These paths are excluded from coverage and duplication analysis.
# Reason for each exclusion is documented inline.

# JPA entities — Lombok-generated code (getters/setters/@PrePersist).
# Sonar would flag missing coverage on generated methods we don't own.
sonar.coverage.exclusions=\
  **/infrastructure/persistence/entity/**, \
  **/ReconciliationEngineApplication.java

# Duplication exclusions — migration SQL files legitimately repeat
# DDL patterns (CREATE TABLE, CREATE INDEX) across versions.
sonar.cpd.exclusions=\
  **/db/migration/**

# Full analysis exclusions — these are not application logic:
#   - db/migration: SQL files, not Java
#   - Generated sources: annotation processor output
sonar.exclusions=\
  **/db/migration/**, \
  **/generated-sources/**
