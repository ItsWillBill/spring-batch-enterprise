spring:
  application:
    name: reconciliation-engine

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:reconciliation_db}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: false # We'll trigger our job manually

app:
  batch:
    input-dir: ${APP_INPUT_DIR:/data/input}
    archive-dir: ${APP_ARCHIVE_DIR:/data/archive}
    chunk-size: ${BATCH_CHUNK_SIZE:500}
    max-threads: ${BATCH_MAX_THREADS:4}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,batch
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.reconciliation: INFO
    org.springframework.batch: INFO
    org.springframework.transaction: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'
