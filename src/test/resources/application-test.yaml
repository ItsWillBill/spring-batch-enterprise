spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:reconciliation_test_db}
    username: ${POSTGRES_USER:testuser}
    password: ${POSTGRES_PASSWORD:testpass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: false

app:
  batch:
    input-dir: target/test-data/input
    archive-dir: target/test-data/archive
    chunk-size: 10
    max-threads: 1

logging:
  level:
    org.flywaydb: INFO
    com.reconciliation: DEBUG
    org.springframework.batch: DEBUG
