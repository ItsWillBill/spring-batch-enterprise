spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=true;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    locations: classpath:/db/migration

  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: false

app:
  batch:
    input-dir: /tmp/input
    archive-dir: /tmp/archive
    chunk-size: 100
    max-threads: 2

logging:
  level:
    org.flywaydb: DEBUG
