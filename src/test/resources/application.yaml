spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:reconciliation_test}
    username: ${POSTGRES_USER:testuser}
    password: ${POSTGRES_PASSWORD:testpass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true

  flyway:
    enabled: true
    locations: classpath:/db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 4
          max-idle: 2
          min-idle: 1

  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: false

app:
  batch:
    input-dir: /tmp/input
    archive-dir: /tmp/archive
    chunk-size: 100
    max-threads: 2

logging:
  level:
    com.reconciliation: DEBUG
    org.springframework.batch: INFO
    org.flywaydb: DEBUG
    org.hibernate.SQL: WARN
